# ============================================================
# .github/workflows/deploy.yml
# Pipeline CI/CD — GitHub Actions
# Proyecto Final Telemática — F1 Tech Hub
# ============================================================
# Qué hace este pipeline:
#   1. Se activa con cada push a la rama 'main'
#   2. Ejecuta los tests de la aplicación
#   3. Construye la imagen Docker
#   4. La sube a Docker Hub
#   5. Se conecta al servidor EC2 y despliega la nueva versión
#
# Secrets necesarios en GitHub (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  → tu usuario de Docker Hub
#   DOCKERHUB_TOKEN     → token de acceso de Docker Hub
#   EC2_HOST            → IP pública de tu instancia EC2
#   EC2_KEY             → contenido de tu archivo .pem (llave SSH)
# ============================================================

name: 🏎️ CI/CD — F1 Tech Hub

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Nombre de la imagen Docker Hub: usuario/repositorio
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/f1-tech-hub

jobs:

  # ──────────────────────────────────────────────────────────
  # JOB 1: TEST — Verifica que la app funciona
  # ──────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: 📦 Instalar dependencias
        run: |
          cd app
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: ✅ Verificar que la app inicia correctamente
        run: |
          cd app
          # Iniciamos la app en background y verificamos el health check
          python app.py &
          APP_PID=$!
          sleep 3
          curl -f http://localhost:5000/api/health && echo "✅ Health check OK"
          kill $APP_PID

  # ──────────────────────────────────────────────────────────
  # JOB 2: BUILD — Construye y sube la imagen Docker
  # Solo corre si los tests pasan y es push a main
  # ──────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🔑 Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          # Etiquetas: latest + número de commit (trazabilidad)
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache para acelerar builds futuros
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # JOB 3: DEPLOY — Despliega en el servidor EC2
  # ──────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy a EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🔑 Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/f1-key.pem
          chmod 600 ~/.ssh/f1-key.pem
          # Agregar el host a known_hosts para evitar prompts interactivos
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Desplegar en EC2
        run: |
          # Conectarse al servidor y ejecutar los comandos de despliegue
          ssh -i ~/.ssh/f1-key.pem ec2-user@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            echo "📦 Actualizando repositorio..."
            cd /opt/f1-tech-hub
            git pull origin main

            echo "🐳 Descargando nueva imagen..."
            docker compose pull

            echo "🔄 Reiniciando servicios..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Limpiando imágenes antiguas..."
            docker image prune -f

            echo "✅ Despliegue completado!"
            docker compose ps
          ENDSSH

      - name: 🏥 Verificar despliegue
        run: |
          sleep 10
          # Verificar que el health check responde correctamente
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/api/health)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Despliegue exitoso! HTTP Status: $HTTP_STATUS"
          else
            echo "❌ Error en el despliegue. HTTP Status: $HTTP_STATUS"
            exit 1
          fi

      - name: 📢 Notificación de éxito
        if: success()
        run: |
          echo "🏎️ F1 Tech Hub desplegado exitosamente!"
          echo "🌐 URL: http://${{ secrets.EC2_HOST }}"
          echo "📦 Imagen: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
