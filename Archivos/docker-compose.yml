# ============================================================
# docker-compose.yml — F1 Tech Hub
# Orquestación de contenedores para producción
# Proyecto Final Telemática
# ============================================================
# Uso:
#   Iniciar:   docker compose up -d
#   Detener:   docker compose down
#   Logs:      docker compose logs -f
#   Rebuild:   docker compose up -d --build
# ============================================================

version: "3.9"

services:

  # ----------------------------------------------------------
  # SERVICIO PRINCIPAL: Aplicación Flask (F1 Tech Hub)
  # ----------------------------------------------------------
  web:
    # Construir la imagen desde el Dockerfile en ./app
    build:
      context: ./app
      dockerfile: Dockerfile

    # Nombre del contenedor (facilita identificación)
    container_name: f1_tech_hub

    # Reiniciar automáticamente si el contenedor falla
    # always → siempre reinicia (ideal para producción)
    restart: always

    # Mapeo de puertos: HOST:CONTENEDOR
    # El mundo exterior accede por el puerto 80,
    # internamente la app corre en 5000
    ports:
      - "80:5000"

    # Variables de entorno para la app
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1

    # Montar la carpeta de la app para actualizaciones sin rebuild
    # En producción normalmente se usa solo la imagen; aquí lo dejamos
    # comentado como opción para desarrollo:
    # volumes:
    #   - ./app:/app

    # Health check a nivel de compose
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # Conectar a la red interna del proyecto
    networks:
      - f1_network

    # Logging: rotar logs para no llenar el disco
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------
  # SERVICIO AUXILIAR: Nginx como Reverse Proxy (opcional)
  # Descomenta este bloque si quieres Nginx delante de Flask
  # ----------------------------------------------------------
  # nginx:
  #   image: nginx:alpine
  #   container_name: f1_nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - web
  #   networks:
  #     - f1_network

# ----------------------------------------------------------
# RED INTERNA DEL PROYECTO
# Aísla los contenedores del resto del sistema
# ----------------------------------------------------------
networks:
  f1_network:
    driver: bridge
    name: f1_tech_network

# ----------------------------------------------------------
# VOLÚMENES (si se usan bases de datos en el futuro)
# ----------------------------------------------------------
volumes:
  f1_data:
    driver: local
